version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tutor-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutor_mvp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
